<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Launch: a beam accelerating out of the frame">
  <defs>
    <linearGradient id="p5bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#010C14"/><stop offset="0.5" stop-color="#04222F"/><stop offset="1" stop-color="#010C14"/>
    </linearGradient>
    <radialGradient id="p5glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00FFBF" stop-opacity="0.34"/>
      <stop offset="0.4" stop-color="#00D8CE" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0075F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p5blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0A8BFF" stop-opacity="0.34"/><stop offset="1" stop-color="#0075F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p5grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 L0 40" fill="none" stroke="#3F9BBE" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <linearGradient id="p5beam" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0075F1" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#0A8BFF" stop-opacity="0.55"/>
      <stop offset="0.75" stop-color="#00FFBF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#DFFFF6" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="p5trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FFBF" stop-opacity="0"/>
      <stop offset="1" stop-color="#00FFBF" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="p5soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="p5soft2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="640" height="320" fill="url(#p5bg)"/>
  <rect width="640" height="320" fill="url(#p5grid)"/>
  <ellipse cx="60" cy="300" rx="240" ry="170" fill="url(#p5blue)"/>
  <ellipse cx="470" cy="110" rx="240" ry="180" fill="url(#p5glow)"/>

  <!-- 加速射出的光束 -->
  <g fill="none" stroke-linecap="round">
    <path d="M -20,300 C 160,290 300,210 470,96" stroke="url(#p5beam)" stroke-width="18" opacity="0.35" filter="url(#p5soft)"/>
    <path d="M -20,300 C 160,290 300,210 470,96" stroke="url(#p5beam)" stroke-width="5"/>
  </g>

  <!-- 速度線 -->
  <g stroke-linecap="round" stroke-width="3">
    <path d="M 150,232 L 236,206" stroke="url(#p5trail)" opacity="0.6"/>
    <path d="M 232,264 L 330,236" stroke="url(#p5trail)" opacity="0.45"/>
    <path d="M 300,166 L 380,140" stroke="url(#p5trail)" opacity="0.5"/>
  </g>

  <!-- 光束頭 -->
  <g>
    <circle cx="470" cy="96" r="34" fill="#00FFBF" fill-opacity="0.28" filter="url(#p5soft2)"/>
    <circle cx="470" cy="96" r="11" fill="#DFFFF6"/>
  </g>

  <!-- 拋出的粒子 -->
  <g fill="#8BFFE4">
    <circle cx="524" cy="70" r="3" fill-opacity="0.7"/>
    <circle cx="556" cy="52" r="2.5" fill-opacity="0.5"/>
    <circle cx="580" cy="88" r="2" fill-opacity="0.4"/>
    <circle cx="418" cy="146" r="2.5" fill-opacity="0.45"/>
  </g>

  <g stroke="#00FFBF" fill="none" stroke-width="2" stroke-opacity="0.30" stroke-linecap="round">
    <path d="M 566,268 l 14,14 l -14,14"/><path d="M 596,268 l 14,14 l -14,14"/>
  </g>
</svg>
