<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Design: nodes connected into a system structure">
  <defs>
    <linearGradient id="p2bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#010C14"/><stop offset="0.5" stop-color="#04222F"/><stop offset="1" stop-color="#010C14"/>
    </linearGradient>
    <radialGradient id="p2glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00FFBF" stop-opacity="0.30"/>
      <stop offset="0.4" stop-color="#00D8CE" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0075F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p2blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0A8BFF" stop-opacity="0.32"/><stop offset="1" stop-color="#0075F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p2grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 L0 40" fill="none" stroke="#3F9BBE" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <filter id="p2soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="640" height="320" fill="url(#p2bg)"/>
  <rect width="640" height="320" fill="url(#p2grid)"/>
  <ellipse cx="80" cy="290" rx="240" ry="170" fill="url(#p2blue)"/>
  <ellipse cx="330" cy="150" rx="250" ry="185" fill="url(#p2glow)"/>

  <!-- 藍圖外框 -->
  <rect x="118" y="52" width="404" height="216" fill="none" stroke="#5FC4E0" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="8 8"/>

  <!-- 結構連線：實線＝已定案，虛線＝規劃中 -->
  <g fill="none" stroke-linecap="round">
    <path d="M320,92 L228,168" stroke="#00FFBF" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M320,92 L412,168" stroke="#00FFBF" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M228,168 L172,236" stroke="#4DA3FF" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M228,168 L286,236" stroke="#4DA3FF" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M412,168 L468,236" stroke="#4DA3FF" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="5 7"/>
  </g>

  <!-- 節點 -->
  <g>
    <circle cx="320" cy="92" r="22" fill="#00FFBF" fill-opacity="0.28" filter="url(#p2soft)"/>
    <circle cx="320" cy="92" r="9" fill="#DFFFF6"/>
    <circle cx="228" cy="168" r="7" fill="#00FFBF"/>
    <circle cx="412" cy="168" r="7" fill="#00FFBF"/>
    <circle cx="172" cy="236" r="5.5" fill="#7FD4FF"/>
    <circle cx="286" cy="236" r="5.5" fill="#7FD4FF"/>
    <circle cx="468" cy="236" r="5.5" fill="none" stroke="#7FD4FF" stroke-width="2" stroke-opacity="0.7"/>
  </g>

  <g stroke="#00FFBF" fill="none" stroke-width="2" stroke-opacity="0.30" stroke-linecap="round">
    <path d="M 566,268 l 14,14 l -14,14"/><path d="M 596,268 l 14,14 l -14,14"/>
  </g>
</svg>
