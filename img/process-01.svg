<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Discover: a scatter of faint nodes with one locked in focus">
  <defs>

    <linearGradient id="p1bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"    stop-color="#010C14"/>
      <stop offset="0.5"  stop-color="#04222F"/>
      <stop offset="1"    stop-color="#010C14"/>
    </linearGradient>

    <radialGradient id="p1glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#00FFBF" stop-opacity="0.38"/>
      <stop offset="0.35" stop-color="#00D8CE" stop-opacity="0.14"/>
      <stop offset="1"    stop-color="#0075F1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="p1blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0A8BFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#0075F1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="p1cross" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#00FFBF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00FFBF" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#00FFBF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="p1crossV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#00FFBF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00FFBF" stop-opacity="0.45"/>
      <stop offset="1"   stop-color="#00FFBF" stop-opacity="0"/>
    </linearGradient>

    <pattern id="p1grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 L0 40" fill="none" stroke="#3F9BBE" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>

    <filter id="p1soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <rect width="640" height="320" fill="url(#p1bg)"/>
  <rect width="640" height="320" fill="url(#p1grid)"/>

  <ellipse cx="80" cy="290" rx="240" ry="170" fill="url(#p1blue)"/>
  <ellipse cx="378" cy="160" rx="230" ry="180" fill="url(#p1glow)"/>

  <!-- 尚未被辨識的雜訊節點 -->
  <g fill="#5FC4E0">
    <circle cx="120" cy="88"  r="3.5" fill-opacity="0.35"/>
    <circle cx="182" cy="196" r="3"   fill-opacity="0.28"/>
    <circle cx="96"  cy="224" r="4"   fill-opacity="0.30"/>
    <circle cx="240" cy="74"  r="3"   fill-opacity="0.32"/>
    <circle cx="268" cy="252" r="3.5" fill-opacity="0.26"/>
    <circle cx="474" cy="70"  r="3"   fill-opacity="0.30"/>
    <circle cx="556" cy="150" r="3.5" fill-opacity="0.28"/>
    <circle cx="520" cy="264" r="3"   fill-opacity="0.24"/>
    <circle cx="600" cy="220" r="2.5" fill-opacity="0.22"/>
    <circle cx="158" cy="140" r="2.5" fill-opacity="0.22"/>
    <circle cx="330" cy="286" r="2.5" fill-opacity="0.22"/>
    <circle cx="418" cy="232" r="2.5" fill-opacity="0.24"/>
  </g>

  <!-- 十字準星 -->
  <rect x="120" y="159" width="516" height="1.5" fill="url(#p1cross)"/>
  <rect x="377" y="30"  width="1.5" height="264"  fill="url(#p1crossV)"/>

  <!-- 鎖定的那一個 -->
  <g>
    <circle cx="378" cy="160" r="86" fill="none" stroke="#00FFBF" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="3 14"/>
    <circle cx="378" cy="160" r="54" fill="none" stroke="#00FFBF" stroke-opacity="0.32" stroke-width="1.5" stroke-dasharray="4 10"/>
    <circle cx="378" cy="160" r="28" fill="none" stroke="#00FFBF" stroke-opacity="0.62" stroke-width="2"/>
    <circle cx="378" cy="160" r="16" fill="#00FFBF" fill-opacity="0.35" filter="url(#p1soft)"/>
    <circle cx="378" cy="160" r="7"  fill="#DFFFF6"/>
  </g>

  <!-- 角落飾件（整組六張共用的收邊語彙） -->
  <g stroke="#00FFBF" fill="none" stroke-width="2" stroke-opacity="0.30" stroke-linecap="round">
    <path d="M 566,268 l 14,14 l -14,14"/>
    <path d="M 596,268 l 14,14 l -14,14"/>
  </g>
</svg>
