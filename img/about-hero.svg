<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-labelledby="ahTitle">
  <title id="ahTitle">Three streams labelled Build, Secure and Run converging into one engineering partner</title>
  <!-- About 頁 Hero 右側插畫。與 hero-kv-1.svg 同一套語彙：三條光路（Build / Secure / Run）匯流成一個節點＝一個工程夥伴。
       動畫在 prefers-reduced-motion 時關閉。 -->
  <defs>
    <radialGradient id="ahGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#00FFBF" stop-opacity="0.42"/>
      <stop offset="0.3"  stop-color="#00D8CE" stop-opacity="0.16"/>
      <stop offset="1"    stop-color="#0075F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ahBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0A8BFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0075F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ahCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFFFFF"/>
      <stop offset="0.2"  stop-color="#C6FFEE" stop-opacity="0.95"/>
      <stop offset="0.5"  stop-color="#00FFBF" stop-opacity="0.45"/>
      <stop offset="1"    stop-color="#00FFBF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ahL1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FFBF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#8BFFE4"/>
    </linearGradient>
    <linearGradient id="ahL2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#C6FFEE"/>
    </linearGradient>
    <linearGradient id="ahL3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A8BFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#8BFFE4"/>
    </linearGradient>
    <linearGradient id="ahOut" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#00FFBF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="ahGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 L0 40" fill="none" stroke="#3F9BBE" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <radialGradient id="ahGridFade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#fff"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="1"   stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="ahGridMask"><rect width="640" height="560" fill="url(#ahGridFade)"/></mask>
    <filter id="ahSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="ahSoft2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <style>
    @keyframes ahFlow  { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -500; } }
    @keyframes ahPulse { 0%,100% { opacity: .5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.18); } }
    @keyframes ahSpin  { to { transform: rotate(360deg); } }
    @keyframes ahRipple{ 0% { transform: scale(1); opacity: .5; } 100% { transform: scale(2.8); opacity: 0; } }
    .ah-flow   { stroke-dasharray: 46 454; animation: ahFlow 6s linear infinite; }
    .ah-flow-2 { animation-duration: 7.5s; animation-delay: -2.5s; }
    .ah-flow-3 { animation-duration: 9s;   animation-delay: -5s; }
    .ah-out    { stroke-dasharray: 60 440; animation: ahFlow 4.5s linear infinite; }
    .ah-core   { transform-box: fill-box; transform-origin: center; animation: ahPulse 4.5s ease-in-out infinite; }
    .ah-ring   { transform-box: view-box; transform-origin: 400px 280px; animation: ahSpin 50s linear infinite; }
    .ah-ring-2 { animation-duration: 36s; animation-direction: reverse; }
    .ah-ripple { transform-box: view-box; transform-origin: 400px 280px; animation: ahRipple 6s cubic-bezier(.2,.6,.3,1) infinite; }
    .ah-ripple-2 { animation-delay: -3s; }
    @media (prefers-reduced-motion: reduce) {
      .ah-flow, .ah-out, .ah-core, .ah-ring, .ah-ripple { animation: none; }
      .ah-flow, .ah-out, .ah-ripple { opacity: 0; }
    }
    .ah-label { font: 600 17px 'Saira', 'Segoe UI', Arial, sans-serif; letter-spacing: .06em; }
  </style>

  <!-- 網格與光暈 -->
  <rect width="640" height="560" fill="url(#ahGrid)" mask="url(#ahGridMask)"/>
  <ellipse cx="400" cy="280" rx="260" ry="240" fill="url(#ahGlow)"/>
  <!-- 光暈必須完整落在畫布內（x 20–320、y 270–530），超出邊界會被裁成硬邊方塊 -->
  <ellipse cx="170" cy="400" rx="150" ry="130" fill="url(#ahBlue)"/>

  <!-- 擴散訊號環 + 雷達環 -->
  <g fill="none" stroke="#00FFBF" stroke-width="2">
    <circle class="ah-ripple" cx="400" cy="280" r="58"/>
    <circle class="ah-ripple ah-ripple-2" cx="400" cy="280" r="58"/>
  </g>
  <g fill="none" stroke="#00FFBF">
    <circle class="ah-ring" cx="400" cy="280" r="96" stroke-opacity="0.34" stroke-width="1.5" stroke-dasharray="4 14"/>
    <circle class="ah-ring ah-ring-2" cx="400" cy="280" r="150" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="2 18"/>
    <circle cx="400" cy="280" r="52" stroke-opacity="0.45" stroke-width="2"/>
  </g>

  <!-- 三條光路：Build / Secure / Run -->
  <g fill="none" stroke-linecap="round">
    <g filter="url(#ahSoft)" stroke-opacity="0.55">
      <path d="M 70,120 C 200,120 270,190 330,236 S 380,272 400,280" stroke="url(#ahL1)" stroke-width="10"/>
      <path d="M 70,280 C 200,280 300,280 400,280" stroke="url(#ahL2)" stroke-width="10"/>
      <path d="M 70,440 C 200,440 270,370 330,324 S 380,288 400,280" stroke="url(#ahL3)" stroke-width="10"/>
      <path d="M 400,280 C 480,280 540,250 640,190" stroke="url(#ahOut)" stroke-width="16"/>
    </g>
    <path d="M 70,120 C 200,120 270,190 330,236 S 380,272 400,280" stroke="url(#ahL1)" stroke-width="3"/>
    <path d="M 70,280 C 200,280 300,280 400,280" stroke="url(#ahL2)" stroke-width="3"/>
    <path d="M 70,440 C 200,440 270,370 330,324 S 380,288 400,280" stroke="url(#ahL3)" stroke-width="3"/>
    <path d="M 400,280 C 480,280 540,250 640,190" stroke="url(#ahOut)" stroke-width="4"/>

    <g filter="url(#ahSoft2)">
      <path class="ah-flow" pathLength="1000" d="M 70,120 C 200,120 270,190 330,236 S 380,272 400,280" stroke="#B6FFEC" stroke-width="7"/>
      <path class="ah-flow ah-flow-2" pathLength="1000" d="M 70,280 C 200,280 300,280 400,280" stroke="#FFFFFF" stroke-width="7"/>
      <path class="ah-flow ah-flow-3" pathLength="1000" d="M 70,440 C 200,440 270,370 330,324 S 380,288 400,280" stroke="#A8DEFF" stroke-width="7"/>
      <path class="ah-out" pathLength="1000" d="M 400,280 C 480,280 540,250 640,190" stroke="#FFFFFF" stroke-width="8"/>
    </g>
  </g>

  <!-- 起點節點與標籤 -->
  <g>
    <circle cx="70" cy="120" r="7" fill="#0B1220" stroke="#00FFBF" stroke-width="2.5"/>
    <circle cx="70" cy="280" r="7" fill="#0B1220" stroke="#4DA3FF" stroke-width="2.5"/>
    <circle cx="70" cy="440" r="7" fill="#0B1220" stroke="#0A8BFF" stroke-width="2.5"/>
    <text class="ah-label" x="70" y="96"  text-anchor="middle" fill="#8BFFE4">BUILD</text>
    <text class="ah-label" x="70" y="256" text-anchor="middle" fill="#A8D4FF">SECURE</text>
    <text class="ah-label" x="70" y="476" text-anchor="middle" fill="#A8D4FF">RUN</text>
  </g>

  <!-- 匯流核心 -->
  <g>
    <circle class="ah-core" cx="400" cy="280" r="120" fill="url(#ahCore)" opacity="0.55"/>
    <circle cx="400" cy="280" r="26" fill="#00FFBF" fill-opacity="0.32" filter="url(#ahSoft2)"/>
    <circle cx="400" cy="280" r="12" fill="#00FFBF"/>
    <circle cx="400" cy="280" r="6" fill="#FFFFFF"/>
  </g>

  <!-- 幾何飾件 -->
  <g stroke="#00FFBF" fill="none" stroke-width="2" stroke-opacity="0.32" stroke-linecap="round">
    <path d="M 560,460 l 16,16 l -16,16"/>
    <path d="M 594,460 l 16,16 l -16,16"/>
  </g>
</svg>
