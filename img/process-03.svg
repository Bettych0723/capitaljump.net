<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Build: modules stacking into a working product">
  <defs>
    <linearGradient id="p3bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#010C14"/><stop offset="0.5" stop-color="#04222F"/><stop offset="1" stop-color="#010C14"/>
    </linearGradient>
    <radialGradient id="p3glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00FFBF" stop-opacity="0.30"/>
      <stop offset="0.4" stop-color="#00D8CE" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0075F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p3blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0A8BFF" stop-opacity="0.32"/><stop offset="1" stop-color="#0075F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p3grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 L0 40" fill="none" stroke="#3F9BBE" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <filter id="p3soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="640" height="320" fill="url(#p3bg)"/>
  <rect width="640" height="320" fill="url(#p3grid)"/>
  <ellipse cx="80" cy="290" rx="240" ry="170" fill="url(#p3blue)"/>
  <ellipse cx="330" cy="170" rx="250" ry="185" fill="url(#p3glow)"/>

  <!-- 由下往上疊起的模組：越上層越亮＝逐步成形 -->
  <g>
    <rect x="196" y="236" width="248" height="30" rx="6" fill="#0A2A3C" stroke="#4DA3FF" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="212" y="192" width="216" height="30" rx="6" fill="#0C3346" stroke="#4DA3FF" stroke-opacity="0.65" stroke-width="1.5"/>
    <rect x="228" y="148" width="184" height="30" rx="6" fill="#0E3E4E" stroke="#00FFBF" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="244" y="104" width="152" height="30" rx="6" fill="#00FFBF" fill-opacity="0.20" stroke="#00FFBF" stroke-opacity="0.9" stroke-width="2"/>
  </g>

  <!-- 最上層裡的程式碼列 -->
  <g fill="#DFFFF6">
    <rect x="258" y="113" width="46" height="4" rx="2" fill-opacity="0.9"/>
    <rect x="312" y="113" width="26" height="4" rx="2" fill-opacity="0.55"/>
    <rect x="258" y="123" width="30" height="4" rx="2" fill-opacity="0.55"/>
    <rect x="296" y="123" width="58" height="4" rx="2" fill-opacity="0.8"/>
  </g>

  <!-- 正在飛入的下一個模組 -->
  <g>
    <rect x="452" y="66" width="58" height="20" rx="5" fill="none" stroke="#00FFBF" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="5 6"/>
    <circle cx="424" cy="96" r="3" fill="#00FFBF" fill-opacity="0.5"/>
    <circle cx="440" cy="84" r="2.5" fill="#00FFBF" fill-opacity="0.35"/>
  </g>

  <ellipse cx="320" cy="119" rx="110" ry="26" fill="#00FFBF" fill-opacity="0.10" filter="url(#p3soft)"/>

  <g stroke="#00FFBF" fill="none" stroke-width="2" stroke-opacity="0.30" stroke-linecap="round">
    <path d="M 566,268 l 14,14 l -14,14"/><path d="M 596,268 l 14,14 l -14,14"/>
  </g>
</svg>
