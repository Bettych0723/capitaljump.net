<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" preserveAspectRatio="xMidYMid slice" role="img"
     aria-label="Illustration: a game controller with pixel particles and mobile, desktop, and console screens">
  <!-- Game Development 區塊插圖（選項 1 用）。控制器輪廓＋像素粒子＋三個平台螢幕（手機／PC／主機）。 -->
  <defs>
    <linearGradient id="gdBg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"    stop-color="#0A1526"/>
      <stop offset="0.55" stop-color="#112038"/>
      <stop offset="1"    stop-color="#0A1526"/>
    </linearGradient>
    <radialGradient id="gdGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#00FFBF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#00D8CE" stop-opacity="0.10"/>
      <stop offset="1"   stop-color="#0075F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gdPad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00FFBF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0075F1" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="gdGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 L0 0 L0 28" fill="none" stroke="#3F9BBE" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <filter id="gdSoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <style>
    @keyframes gdFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes gdBlink { 0%,100% { opacity: .25; } 50% { opacity: .9; } }
    @keyframes gdRise  { 0% { transform: translateY(10px); opacity: 0; } 30% { opacity: .9; } 100% { transform: translateY(-26px); opacity: 0; } }
    .gd-float { animation: gdFloat 6s ease-in-out infinite; }
    .gd-blink   { animation: gdBlink 2.6s ease-in-out infinite; }
    .gd-blink-2 { animation-delay: -.9s; }
    .gd-blink-3 { animation-delay: -1.8s; }
    .gd-rise   { animation: gdRise 3.4s ease-in-out infinite; }
    .gd-rise-2 { animation-delay: -1.1s; }
    .gd-rise-3 { animation-delay: -2.2s; }
    @media (prefers-reduced-motion: reduce) {
      .gd-float, .gd-blink, .gd-rise { animation: none; }
      .gd-rise { opacity: .5; }
    }
  </style>

  <rect width="560" height="320" fill="url(#gdBg)"/>
  <rect width="560" height="320" fill="url(#gdGrid)"/>
  <ellipse cx="300" cy="150" rx="230" ry="150" fill="url(#gdGlow)"/>

  <!-- 三個平台螢幕：手機、PC、主機 -->
  <g fill="none" stroke="#4DA3FF" stroke-opacity="0.65" stroke-width="2">
    <rect x="58" y="96" width="40" height="66" rx="7"/>
    <rect x="452" y="92" width="62" height="44" rx="6"/>
    <rect x="446" y="196" width="74" height="36" rx="8"/>
  </g>
  <g fill="#4DA3FF" fill-opacity="0.16">
    <rect x="58" y="96" width="40" height="66" rx="7"/>
    <rect x="452" y="92" width="62" height="44" rx="6"/>
    <rect x="446" y="196" width="74" height="36" rx="8"/>
  </g>
  <g stroke="#A8DEFF" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round">
    <path d="M 70,150 h 16"/>
    <path d="M 470,146 h 26"/>
    <path d="M 462,214 h 12 M 468,208 v 12"/>
    <circle cx="500" cy="210" r="3"/>
    <circle cx="508" cy="218" r="3"/>
  </g>

  <!-- 控制器 -->
  <g class="gd-float">
    <path d="M 214,118 h 132 c 30,0 52,24 58,54 l 12,58 c 6,28 -12,46 -34,46 c -18,0 -28,-12 -38,-26 l -12,-16 h -104 l -12,16 c -10,14 -20,26 -38,26 c -22,0 -40,-18 -34,-46 l 12,-58 c 6,-30 28,-54 58,-54 z"
          fill="url(#gdPad)" stroke="#00FFBF" stroke-opacity="0.85" stroke-width="2.5"/>
    <!-- 十字鍵 -->
    <g stroke="#8BFFE4" stroke-opacity="0.9" stroke-width="2.5" stroke-linecap="round">
      <path d="M 196,168 h 36"/>
      <path d="M 214,150 v 36"/>
    </g>
    <!-- 按鈕 -->
    <g>
      <circle class="gd-blink"            cx="356" cy="150" r="9" fill="#00FFBF" fill-opacity="0.85"/>
      <circle class="gd-blink gd-blink-2" cx="380" cy="172" r="9" fill="#4DA3FF" fill-opacity="0.85"/>
      <circle class="gd-blink gd-blink-3" cx="332" cy="172" r="9" fill="#C6FFEE" fill-opacity="0.8"/>
      <circle cx="356" cy="194" r="9" fill="#FFFFFF" fill-opacity="0.35"/>
    </g>
    <!-- 中央指示燈 -->
    <circle cx="280" cy="150" r="14" fill="#00FFBF" fill-opacity="0.3" filter="url(#gdSoft)"/>
    <circle cx="280" cy="150" r="5" fill="#DFFFF6"/>
  </g>

  <!-- 像素粒子 -->
  <g fill="#00FFBF">
    <rect class="gd-rise"            x="150" y="84" width="8" height="8" rx="1" fill-opacity="0.85"/>
    <rect class="gd-rise gd-rise-2"  x="286" y="70" width="6" height="6" rx="1" fill-opacity="0.7"/>
    <rect class="gd-rise gd-rise-3"  x="404" y="90" width="7" height="7" rx="1" fill-opacity="0.6"/>
  </g>
  <g fill="#4DA3FF" fill-opacity="0.6">
    <rect class="gd-rise gd-rise-2" x="196" y="252" width="6" height="6" rx="1"/>
    <rect class="gd-rise"           x="360" y="258" width="7" height="7" rx="1"/>
  </g>
</svg>
