<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 480" width="1920" height="480" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <!-- Managed IT & Cloud 頁專用頁首底圖（.page-header.page-header-managed）。
       左側＝機房三層機櫃把資料往上送進雲端（遷移）；右側＝24 小時刻度環與持續跳動的監控脈衝（代管）。
       版面依據與其他頁首相同：標題置中落在 y 150–330，中央壓暗。 -->
  <defs>
    <linearGradient id="pmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#02141C"/>
      <stop offset="0.4"  stop-color="#06273A"/>
      <stop offset="0.72" stop-color="#042433"/>
      <stop offset="1"    stop-color="#010E16"/>
    </linearGradient>
    <radialGradient id="pmMint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#00FFBF" stop-opacity="0.20"/>
      <stop offset="0.45" stop-color="#00D8CE" stop-opacity="0.07"/>
      <stop offset="1"   stop-color="#0075F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pmBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#0A8BFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#0075F1" stop-opacity="0.09"/>
      <stop offset="1"   stop-color="#0075F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pmGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 L0 48" fill="none" stroke="#3F9BBE" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <radialGradient id="pmGridMaskG" cx="0.5" cy="0.5" r="0.62">
      <stop offset="0"   stop-color="#4a4a4a"/>
      <stop offset="0.5" stop-color="#8a8a8a"/>
      <stop offset="1"   stop-color="#ffffff"/>
    </radialGradient>
    <mask id="pmGridMask"><rect width="1920" height="480" fill="url(#pmGridMaskG)"/></mask>
    <radialGradient id="pmDim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#01080E" stop-opacity="0.78"/>
      <stop offset="0.55" stop-color="#01080E" stop-opacity="0.56"/>
      <stop offset="0.85" stop-color="#01080E" stop-opacity="0.18"/>
      <stop offset="1"    stop-color="#01080E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pmTopFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#01080E" stop-opacity="0.6"/>
      <stop offset="0.28" stop-color="#01080E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pmBotFade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0"    stop-color="#0B1220" stop-opacity="0.82"/>
      <stop offset="0.18" stop-color="#0B1220" stop-opacity="0"/>
    </linearGradient>
    <filter id="pmSoft" x="-60%" y="-60%" width="220%" height="220%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <style>
    @keyframes pmFlow  { to { stroke-dashoffset: -160; } }
    @keyframes pmSpin  { to { transform: rotate(360deg); } }
    @keyframes pmBeat  { 0%,100% { opacity: .30; } 50% { opacity: .95; } }
    @keyframes pmRun   { to { stroke-dashoffset: -1200; } }
    .pm-flow { stroke-dasharray: 10 16; animation: pmFlow 3.2s linear infinite; }
    .pm-ring { transform-box: view-box; transform-origin: 1724px 240px; animation: pmSpin 24s linear infinite; }
    .pm-beat { animation: pmBeat 2.6s ease-in-out infinite; }
    .pm-run  { stroke-dasharray: 150 1050; animation: pmRun 6s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .pm-flow, .pm-ring, .pm-beat, .pm-run { animation: none; }
      .pm-run { stroke-dasharray: none; opacity: .5; }
    }
  </style>

  <rect width="1920" height="480" fill="url(#pmBg)"/>
  <g mask="url(#pmGridMask)"><rect width="1920" height="480" fill="url(#pmGrid)"/></g>
  <ellipse cx="330" cy="250" rx="420" ry="250" fill="url(#pmBlue)"/>
  <ellipse cx="1724" cy="240" rx="380" ry="235" fill="url(#pmMint)"/>

  <!-- 左：機櫃三層 → 往上遷移進雲端 -->
  <g>
    <!-- 雲 -->
    <g transform="translate(300 120)">
      <path d="M 40,56 a 34,34 0 0 1 34,-34 a 44,44 0 0 1 84,-10 a 32,32 0 0 1 30,44 Z"
            fill="#0A8BFF" fill-opacity="0.12" stroke="#4DA3FF" stroke-opacity="0.55" stroke-width="2.5" stroke-linejoin="round"/>
      <circle class="pm-beat" cx="130" cy="34" r="5" fill="#00FFBF"/>
    </g>
    <!-- 遷移路徑 -->
    <g class="pm-flow" fill="none" stroke="#00FFBF" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round">
      <path d="M 212,330 C 212,250 300,236 352,206"/>
      <path d="M 272,330 C 272,262 330,230 372,206"/>
      <path d="M 332,330 C 332,276 360,232 392,206"/>
    </g>
    <!-- 機櫃 -->
    <g>
      <g fill="#0E2436" fill-opacity="0.9" stroke="#2F6E87" stroke-opacity="0.65" stroke-width="2">
        <rect x="170" y="336" width="200" height="34" rx="8"/>
        <rect x="170" y="378" width="200" height="34" rx="8"/>
        <rect x="170" y="420" width="200" height="34" rx="8"/>
      </g>
      <g fill="#4DA3FF" fill-opacity="0.75">
        <circle cx="194" cy="353" r="4"/><circle cx="194" cy="395" r="4"/><circle cx="194" cy="437" r="4"/>
      </g>
      <g fill="none" stroke="#3F9BBE" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round">
        <path d="M 216,353 H 346"/><path d="M 216,395 H 318"/><path d="M 216,437 H 332"/>
      </g>
    </g>
  </g>

  <!-- 右：24 小時刻度環 + 監控脈衝 -->
  <g>
    <circle cx="1724" cy="240" r="118" fill="none" stroke="#00FFBF" stroke-opacity="0.16" stroke-width="1.5"/>
    <circle cx="1724" cy="240" r="92"  fill="none" stroke="#00FFBF" stroke-opacity="0.10" stroke-width="1.5"/>
    <g class="pm-ring" fill="none" stroke="#00FFBF" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 28">
      <circle cx="1724" cy="240" r="118"/>
    </g>
    <circle class="pm-beat" cx="1724" cy="122" r="7" fill="#00FFBF"/>
    <circle cx="1724" cy="240" r="30" fill="#00FFBF" fill-opacity="0.18" filter="url(#pmSoft)"/>
    <circle cx="1724" cy="240" r="7" fill="#DFFFF6" fill-opacity="0.85"/>
  </g>

  <!-- 右：持續跑動的監控線 -->
  <g fill="none" stroke="#00FFBF" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path class="pm-run" d="M 1380,420 h 90 l 18,-34 l 22,66 l 20,-32 h 74 l 16,-22 l 20,44 l 18,-26 h 96 l 16,-30 l 22,56 l 18,-26 h 86"/>
  </g>
  <path d="M 1380,420 H 1896" fill="none" stroke="#3F9BBE" stroke-opacity="0.25" stroke-width="1.5"/>

  <ellipse cx="960" cy="240" rx="830" ry="265" fill="url(#pmDim)"/>
  <rect width="1920" height="480" fill="url(#pmTopFade)"/>
  <rect width="1920" height="480" fill="url(#pmBotFade)"/>
</svg>
