<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <!-- Cybersecurity 頁首底圖的「手機版」（<768px 時取代 page-header-cyber.svg）。
       雷達移到右上、鎖定框移到左下，整組收在安全區（x 60–580、y 80–330）內。 -->
  <defs>
    <linearGradient id="pcmBg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"    stop-color="#01121B"/>
      <stop offset="0.45" stop-color="#062638"/>
      <stop offset="0.75" stop-color="#04202E"/>
      <stop offset="1"    stop-color="#010C14"/>
    </linearGradient>
    <radialGradient id="pcmMint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#00FFBF" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#00D8CE" stop-opacity="0.08"/>
      <stop offset="1"   stop-color="#0075F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pcmBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#0A8BFF" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#0075F1" stop-opacity="0.10"/>
      <stop offset="1"   stop-color="#0075F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pcmSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FFBF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#00FFBF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="pcmGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 L0 40" fill="none" stroke="#3F9BBE" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <radialGradient id="pcmGridMaskG" cx="0.5" cy="0.5" r="0.65">
      <stop offset="0"   stop-color="#5a5a5a"/>
      <stop offset="0.5" stop-color="#8a8a8a"/>
      <stop offset="1"   stop-color="#ffffff"/>
    </radialGradient>
    <mask id="pcmGridMask"><rect width="640" height="400" fill="url(#pcmGridMaskG)"/></mask>
    <radialGradient id="pcmDim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#01080E" stop-opacity="0.76"/>
      <stop offset="0.55" stop-color="#01080E" stop-opacity="0.56"/>
      <stop offset="0.85" stop-color="#01080E" stop-opacity="0.18"/>
      <stop offset="1"    stop-color="#01080E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pcmTopFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#01080E" stop-opacity="0.6"/>
      <stop offset="0.25" stop-color="#01080E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pcmBotFade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0"    stop-color="#0B1220" stop-opacity="0.8"/>
      <stop offset="0.16" stop-color="#0B1220" stop-opacity="0"/>
    </linearGradient>
    <filter id="pcmSoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <style>
    @keyframes pcmSpin  { to { transform: rotate(360deg); } }
    @keyframes pcmPing  { 0% { r: 5; opacity: .9; } 70% { opacity: .1; } 100% { r: 26; opacity: 0; } }
    @keyframes pcmBlink { 0%,100% { opacity: .25; } 50% { opacity: .9; } }
    .pcm-sweep { transform-box: view-box; transform-origin: 470px 130px; animation: pcmSpin 8s linear infinite; }
    .pcm-ring  { transform-box: view-box; transform-origin: 470px 130px; animation: pcmSpin 60s linear infinite; }
    .pcm-ping  { animation: pcmPing 4s ease-out infinite; }
    .pcm-blink { animation: pcmBlink 3.2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .pcm-sweep, .pcm-ring, .pcm-ping, .pcm-blink { animation: none; }
      .pcm-sweep, .pcm-ping { opacity: 0; }
    }
  </style>

  <rect width="640" height="400" fill="url(#pcmBg)"/>
  <g mask="url(#pcmGridMask)"><rect width="640" height="400" fill="url(#pcmGrid)"/></g>
  <ellipse cx="470" cy="130" rx="240" ry="180" fill="url(#pcmMint)"/>
  <ellipse cx="110" cy="330" rx="230" ry="175" fill="url(#pcmBlue)"/>

  <!-- 右上：雷達 -->
  <g>
    <g fill="none" stroke="#00FFBF" stroke-opacity="0.22" stroke-width="1.5">
      <circle cx="470" cy="130" r="52"/>
      <circle cx="470" cy="130" r="92"/>
      <circle cx="470" cy="130" r="128" stroke-opacity="0.14"/>
    </g>
    <g class="pcm-ring" fill="none" stroke="#00FFBF" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="4 16">
      <circle cx="470" cy="130" r="110"/>
    </g>
    <g class="pcm-sweep">
      <path d="M 470,130 L 598,130 A 128,128 0 0 0 560,40 Z" fill="url(#pcmSweep)"/>
      <path d="M 470,130 L 598,130" stroke="#00FFBF" stroke-opacity="0.7" stroke-width="2"/>
    </g>
    <g>
      <circle class="pcm-ping" cx="524" cy="86" r="5" fill="none" stroke="#FF8A5B" stroke-opacity="0.8" stroke-width="2"/>
      <circle cx="524" cy="86" r="5" fill="#FF8A5B" fill-opacity="0.85"/>
      <circle cx="412" cy="178" r="5" fill="#4DA3FF" fill-opacity="0.85"/>
    </g>
    <circle cx="470" cy="130" r="16" fill="#00FFBF" fill-opacity="0.26" filter="url(#pcmSoft)"/>
    <circle cx="470" cy="130" r="6" fill="#DFFFF6"/>
  </g>

  <!-- 左下：鎖定框與探測虛線 -->
  <g>
    <g fill="none" stroke="#3F9BBE" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round">
      <path d="M 92,236 h -24 v -24"/>
      <path d="M 188,236 h 24 v -24"/>
      <path d="M 92,330 h -24 v 24"/>
      <path d="M 188,330 h 24 v 24"/>
    </g>
    <rect class="pcm-blink" x="100" y="244" width="80" height="80" rx="10" fill="#4DA3FF" fill-opacity="0.10" stroke="#4DA3FF" stroke-opacity="0.6" stroke-width="1.5"/>
    <g fill="none" stroke="#FF8A5B" stroke-opacity="0.38" stroke-width="2" stroke-dasharray="6 9" stroke-linecap="round">
      <path d="M 230,268 H 330"/>
      <path d="M 230,306 H 300"/>
    </g>
    <g fill="#FF8A5B" fill-opacity="0.55">
      <circle cx="330" cy="268" r="4.5"/>
      <circle cx="300" cy="306" r="4.5"/>
    </g>
  </g>

  <ellipse cx="320" cy="200" rx="380" ry="230" fill="url(#pcmDim)"/>
  <rect width="640" height="400" fill="url(#pcmTopFade)"/>
  <rect width="640" height="400" fill="url(#pcmBotFade)"/>
</svg>
